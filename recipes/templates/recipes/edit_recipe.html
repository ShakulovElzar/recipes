{% extends 'base.html' %}

{% block title %}Edit Recipe{% endblock %}

{% block content %}

<div class="container py-4">
    <div class="form p-4 p-md-5">
        <p class="section-label text-center justify-content-center" style="color: var(--sage);">Make it better</p>
        <h1 class="text-center mb-4" style="font-style: italic;">Edit Recipe</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.media }}
            {{ form|crispy }}
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary px-5">Save Changes</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

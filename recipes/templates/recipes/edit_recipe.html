{% extends 'base.html' %}

{% block title %}Edit Recipe{% endblock %}

{% block content %}

<div class="container">
    <form method="post" enctype="multipart/form-data" class="p-4 form">
        <h1 class="text-center">Edit Recipe</h1>
        {% csrf_token %}
        {{ form.media }}
        {{ form|crispy }}
        <div class="text-center">
            <button type="submit" class="btn btn-primary mt-2">Save changes</button>
        </div>
    </form>
</div>

{% endblock %}

{% extends 'base.html' %}

{% block title %}Delete Recipe{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="form p-5 text-center" style="max-width: 32rem;">
        <div style="font-size: 2.5rem; margin-bottom: 1rem;">🗑️</div>
        <h1 style="font-size: 1.75rem; font-style: italic;">Delete Recipe?</h1>
        <p class="mt-3 mb-4" style="color: var(--text-muted);">
            Are you sure you want to permanently delete <strong>"{{ object.title }}"</strong>? This cannot be undone.
        </p>
        <form method="post" class="d-flex gap-3 justify-content-center">
            {% csrf_token %}
            <a href="{% url 'recipes' %}" class="btn btn-outline-primary px-4">Cancel</a>
            <input type="submit" value="Delete" class="btn btn-danger px-4">
        </form>
    </div>
</div>

{% endblock %}

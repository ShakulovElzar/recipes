{% extends 'base.html' %}

{% block title %}Delete Recipe {{ object.title }} {% endblock %}

{% block content %}

<div class="container">
    <h1 class="text-center mt-2">Confirm Recipe Deletion</h1>
    <div class="d-flex justify-content-center pt-3">
        <form method="post" class="text-center">
            {% csrf_token %}
            <p>Are you sure you want to delete the recipe "{{ object.title }}"?</p>
            <input type="submit" value="Confirm" class="btn btn-danger w-25">
        </form>
    </div>
</div>
{% endblock %}
